<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS en tablas</title>
    <style>
        table, td, th {
            border: 2px solid blue;
            border-collapse: collapse;
        }
        table { 
            width: 50%; 
            margin:auto;
        }
        tr { height: 50px; }
        td { vertical-align:middle ;
            text-align:center; }
        tr:hover { background-color: cornflowerblue; }
        tr:nth-child(odd) { background-color: lavender;}

        body {
            background-color: rgb(231, 236, 238);
        }
    </style>
</head>
<body>
    <h1>CSS en tablas</h1>
    <table>
        <tr>

            <th>
                Artículo
            </th>
            <th>
                Precio
            </th>
        </tr>
        <tr>
            <td>Queso manchego</td>
            <td>15.00 €</td>
        </tr>
        <tr>
            <td>Aceite de oliva</td>
            <td>8.50 €</td>
        </tr>
        <tr>
            <td>Mazapanes</td>
            <td>12.00 €</td>
        </tr>

    </table>

    <p><a href="index.html">Volver al índice principal</a></p>
</body>
</html>
